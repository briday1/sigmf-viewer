[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmf-viewer"
version = "0.2.3"
description = "A focused windowed SigMF spectrum and waterfall browser built with Sigvue"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "plotly>=6.1.1",
    "sigvue>=2026.58",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "tomli>=2; python_version < '3.11'"]
release = ["build>=1.2", "twine>=5.0"]

[project.scripts]
sigmf-viewer = "sigmf_viewer.cli:main"

[project.entry-points."sigvue.workspaces"]
sigmf-viewer = "sigmf_viewer.workspace:create_workspace"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
