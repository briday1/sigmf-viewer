name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current Sigvue and viewer
        run: |
          python -m pip install "sigvue @ git+https://github.com/briday1/sigvue.git@main"
          python -m pip install -e ".[test,release]"
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
